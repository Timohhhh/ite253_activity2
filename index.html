<!DOCTYPE html>
<html>
<head>
    <title>Simple JavaScript CRUD</title>
</head>
<body>
    <h1>Student CRUD System</h1>
        <input type="hidden" id="editIndex" value="-1">
        <label>Student ID:</label>
        <input type="text" id="studentID">
    <br><br>
        <label>Student Name:</label>
        <input type="text" id="studentName">
    <br><br>
        <label>Course:</label>
        <input type="text" id="studentCourse">
    <br><br>
        <input type="button" onclick="saveStudent()" value="Save Student">
        <button onclick="clearForm()">Cancel</button>
    <hr>

    <h2>Search Student</h2>
    <label>Student Name:</label>
    <input type="text" id="searchName">
    <input type="button" onclick="search()" value="Search">
    <input type="button" onclick="showAll()" value="Show All">
    <hr>

    <input type="button" onclick="sortByName()" value="Sort by Name">
    <hr>

    <h2>Student Records</h2>
    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Number</th>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable">
        </tbody>
    </table>
    <p id="totalCount">Total Students: 0</p>
    <hr>

        <script>
            // STORE STUDENT RECORDS VIA ARRAYS
            let students = [];

            // CREATE AND UPDATE RECORDS
            function saveStudent() {
                let id = document.getElementById("studentID").value;
                let name = document.getElementById("studentName").value;
                let course = document.getElementById("studentCourse").value;
                let editIndex = parseInt(document.getElementById("editIndex").value);

                if (id == "" || name == "" || course == "") {
                    alert("Please complete all fields.");
                    return;
                }

                // CHECKS UNIQUE STUDENT ID
                for (let i = 0; i < students.length; i++) {
                    if (i != editIndex && students[i].id.toLowerCase() == id.toLowerCase()) {
                        alert("That Student ID is already in use. Please enter a unique ID.");
                        return;
                    }
                }

                // CHECKS STUDENT NAME
                for (let i = 0; i < students.length; i++) {
                    if (i != editIndex && students[i].name.toLowerCase() == name.toLowerCase()) {
                        alert("A student with that name already exists. Please enter a unique name.");
                        return;
                    }
                }

                if (editIndex == -1) {
                    // CREATES NEW STUDENT RECORD
                    let newStudent = {
                        id: id,
                        name: name,
                        course: course
                    };
                    // Add student without push
                    students[students.length] = newStudent;
                    alert("Student added successfully.");
                } else {
                    // Update existing student
                    students[editIndex].id = id;
                    students[editIndex].name = name;
                    students[editIndex].course = course;
                    alert("Student updated successfully.");
                }

                clearForm();
                displayStudents();
            }

            // DISPLAY RECORDS
            function displayStudents(list) {
                if (list === undefined) {
                    list = students;
                }

                let table = document.getElementById("studentTable");
                table.innerHTML = "";

                if (list.length == 0) {
                    table.innerHTML = "<tr><td colspan='5'>No student records found.</td></tr>";
                    document.getElementById("totalCount").innerHTML = "Total Students: " + students.length;
                    return;
                }

                for (let index = 0; index < list.length; index++) {
                    let realIndex = -1;
                    for (let j = 0; j < students.length; j++) {
                        if (students[j] === list[index]) {
                            realIndex = j;
                            break;
                        }
                    }

                    table.innerHTML +=
                        "<tr>" +
                            "<td>" + (index + 1) + "</td>" +
                            "<td>" + list[index].id + "</td>" +
                            "<td>" + list[index].name + "</td>" +
                            "<td>" + list[index].course + "</td>" +
                            "<td>" +
                                "<button onclick='editStudent(" + realIndex + ")'>Edit</button> " +
                                "<button onclick='deleteStudent(" + realIndex + ")'>Delete</button>" +
                            "</td>" +
                        "</tr>";
                }

                // DISPLAY TOTAL STUDENT COUNT
                document.getElementById("totalCount").innerHTML = "Total Students: " + students.length;
            }

            function editStudent(index) {
                document.getElementById("studentID").value = students[index].id;
                document.getElementById("studentName").value = students[index].name;
                document.getElementById("studentCourse").value = students[index].course;
                document.getElementById("editIndex").value = index;
            }

            // DELETES SELECTED RECORD
            function deleteStudent(index) {
                let answer = confirm("Are you sure you want to delete this student?");
                if (answer == false) {
                    return;
                }

                // CHANGES RECORDS ONCE DELETED
                for (let position = index; position < students.length - 1; position++) {
                    students[position] = students[position + 1];
                }

                students.length = students.length - 1;

                clearForm();
                displayStudents();
                alert("Student deleted successfully.");
            }

            // CLEARS ALL INPUT FIELDS 
            function clearForm() {
                document.getElementById("studentID").value = "";
                document.getElementById("studentName").value = "";
                document.getElementById("studentCourse").value = "";
                document.getElementById("editIndex").value = "-1";
            }

            function containsText(text, query) {
                if (query.length > text.length) {
                    return false;
                }

                for (let start = 0; start <= text.length - query.length; start++) {
                    let matched = true;
                    for (let offset = 0; offset < query.length; offset++) {
                        if (text.charAt(start + offset) != query.charAt(offset)) {
                            matched = false;
                            break;
                        }
                    }
                    if (matched) {
                        return true;
                    }
                }
                return false;
            }

            // SEARCH BY STUDENT'S NAME
            function search() {
                let query = document.getElementById("searchName").value.toLowerCase();

                if (query == "") {
                    alert("Please enter a name to search.");
                    return;
                }

                let results = [];
                for (let i = 0; i < students.length; i++) {
                    if (containsText(students[i].name.toLowerCase(), query)) {
                        results[results.length] = students[i];
                    }
                }

                displayStudents(results);
            }

            // Show all student records
            function showAll() {
                document.getElementById("searchName").value = "";
                displayStudents();
            }

            // SORTS STUDENT'S NAMES ALPHABETICALLY
            function sortByName() {
                let sorted = [];
                for (let i = 0; i < students.length; i++) {
                    sorted[sorted.length] = students[i];
                }

                for (let i = 0; i < sorted.length - 1; i++) {
                    for (let j = 0; j < sorted.length - 1 - i; j++) {
                        let nameA = sorted[j].name.toLowerCase();
                        let nameB = sorted[j + 1].name.toLowerCase();
                        if (nameA > nameB) {
                            let temp = sorted[j];
                            sorted[j] = sorted[j + 1];
                            sorted[j + 1] = temp;
                        }
                    }
                }

                displayStudents(sorted);
            }

            // DISPLAYS RECORD TABLE
            displayStudents();

        </script>
    </body>
</html>
